<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Windows 11 Fluent Multi-Stop Diagonal Lighting Gradients -->
    <linearGradient id="fluentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fdfaf5" />
      <stop offset="70%" stop-color="#f7efe4" />
      <stop offset="100%" stop-color="#eee2d3" />
    </linearGradient>

    <!-- Spine Leather/Paper Texture Gradient -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3eae0" />
      <stop offset="85%" stop-color="#ebdecfa0" />
      <stop offset="100%" stop-color="#d9cbba" />
    </linearGradient>

    <!-- 3D Wax/Enamel Seal Radial Gradient -->
    <radialGradient id="sealGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d67b93" />
      <stop offset="45%" stop-color="#b4637a" />
      <stop offset="90%" stop-color="#8f4358" />
      <stop offset="100%" stop-color="#703244" />
    </radialGradient>

    <!-- Hero Typography Indigo Ink 3D Gradient -->
    <linearGradient id="heroInkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#464168" />
      <stop offset="100%" stop-color="#5a547c" />
    </linearGradient>

    <!-- Bookmark Inset Rose Gradient -->
    <linearGradient id="bookmarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c47289" />
      <stop offset="100%" stop-color="#a85269" />
    </linearGradient>

    <!-- Gem/Ruby Bead Radial Gradient -->
    <radialGradient id="rubyGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ea94a9" />
      <stop offset="50%" stop-color="#b4637a" />
      <stop offset="100%" stop-color="#6e2b3c" />
    </radialGradient>

    <!-- Fluent Layer Elevation Shadows (Multi-pass realistic soft blur) -->
    <filter id="spineElevation" x="-5%" y="-5%" width="125%" height="110%">
      <feDropShadow dx="4" dy="0" stdDeviation="5" flood-color="#4a3e36" flood-opacity="0.14" />
      <feDropShadow dx="1" dy="0" stdDeviation="1.5" flood-color="#4a3e36" flood-opacity="0.08" />
    </filter>

    <filter id="sealElevation" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#575279" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#575279" flood-opacity="0.18" />
    </filter>

    <filter id="fluent3dText" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4.5" stdDeviation="3.5" flood-color="#2c2523" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#2c2523" flood-opacity="0.12" />
    </filter>

    <filter id="bookmarkInset" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#36282b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ======================================================================= -->
  <!-- Layer 1: Windows 11 Fluent Canvas Base (512x512, Full Bleed R=104, No Margins) -->
  <!-- ======================================================================= -->
  <rect x="0" y="0" width="512" height="512" rx="104" ry="104" fill="url(#fluentBg)" />

  <!-- Fluent Top-Left Specular Light Rim (Subtle Acrylic Inner Border) -->
  <rect x="0.75" y="0.75" width="510.5" height="510.5" rx="103.25" ry="103.25" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.85" />
  <rect x="1.5" y="1.5" width="509" height="509" rx="102.5" ry="102.5" fill="none" stroke="#d5c8b8" stroke-width="1" opacity="0.5" />

  <!-- ======================================================================= -->
  <!-- Layer 2: Concentric Left Spine Rail with Fluent 3D Lateral Shadow -->
  <!-- ======================================================================= -->
  <path d="M 104,0 L 150,0 A 18,18 0 0 1 168,18 L 168,494 A 18,18 0 0 1 150,512 L 104,512 A 104,104 0 0 1 0,408 L 0,104 A 104,104 0 0 1 104,0 Z" 
        fill="url(#spineGrad)" filter="url(#spineElevation)" />

  <!-- Spine Inner Seam Highlight -->
  <line x1="168" y1="18" x2="168" y2="494" stroke="#ffffff" stroke-width="1" opacity="0.6" />

  <!-- ======================================================================= -->
  <!-- Layer 3: Brand Prefix 'lx' - 3D Tactile Enamel/Wax Seal -->
  <!-- ======================================================================= -->
  <g id="brand-lx" transform="translate(108, 122)" filter="url(#sealElevation)">
    <!-- Main Seal Body with Radial Depth -->
    <circle cx="0" cy="0" r="34" fill="url(#sealGrad)" />
    <!-- Beveled Light Reflection Edge -->
    <circle cx="0" cy="0" r="32.5" fill="none" stroke="#ffccd7" stroke-width="0.8" opacity="0.45" />
    <circle cx="0" cy="0" r="29.5" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.25" />
    <!-- Script 'lx' with Specular Pure Ivory Fill -->
    <text x="-1" y="11.5" font-family="'Segoe Script', 'Brush Script MT', 'Snell Roundhand', cursive" font-size="36" font-weight="bold" font-style="italic" fill="#ffffff" text-anchor="middle" style="text-shadow: 0 1px 2px rgba(0,0,0,0.3);">lx</text>
  </g>

  <!-- ======================================================================= -->
  <!-- Layer 4: Top Framing Hairline with 3D Jewel Bead -->
  <!-- ======================================================================= -->
  <g id="top-framing">
    <!-- Shadowed Guide Hairline -->
    <line x1="196" y1="102" x2="456" y2="102" stroke="#575279" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
    <line x1="196" y1="103" x2="456" y2="103" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
    <!-- 3D Ruby Gem Node -->
    <circle cx="456" cy="102" r="4.5" fill="url(#rubyGrad)" />
    <circle cx="454.5" cy="100.5" r="1.2" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- ======================================================================= -->
  <!-- Layer 5: HERO TYPOGRAPHY: 'INDEX' with Fluent 3D Layering -->
  <!-- ======================================================================= -->
  <g id="hero-index" transform="translate(8, 6)" filter="url(#fluent3dText)">
    <!-- Row 1: 'IN' -->
    <rect x="188" y="136" width="25" height="92" rx="3" fill="url(#heroInkGrad)" />
    <!-- Integrated Index Bookmark / Slit Cutout with Depth -->
    <rect x="195.5" y="148" width="10" height="68" rx="3" fill="url(#bookmarkGrad)" filter="url(#bookmarkInset)" />
    <circle cx="200.5" cy="154" r="1.5" fill="#ffffff" opacity="0.7" />

    <!-- 'N' Stems and Diagonal -->
    <rect x="234" y="136" width="22" height="92" rx="2" fill="url(#heroInkGrad)" />
    <rect x="292" y="136" width="22" height="92" rx="2" fill="url(#heroInkGrad)" />
    <polygon points="234,136 256,136 314,228 292,228" fill="url(#heroInkGrad)" />

    <!-- Row 2: 'DEX' -->
    <!-- 'D' -->
    <path d="M 188,244 L 228,244 A 46,46 0 0 1 272,290 A 46,46 0 0 1 228,336 L 188,336 Z M 210,266 L 226,266 A 24,24 0 0 1 250,290 A 24,24 0 0 1 226,314 L 210,314 Z" fill-rule="evenodd" fill="url(#heroInkGrad)" />

    <!-- 'E' -->
    <rect x="286" y="244" width="22" height="92" rx="2" fill="url(#heroInkGrad)" />
    <rect x="308" y="244" width="46" height="21" rx="2" fill="url(#heroInkGrad)" />
    <rect x="308" y="279.5" width="38" height="21" rx="2" fill="url(#heroInkGrad)" />
    <rect x="308" y="315" width="46" height="21" rx="2" fill="url(#heroInkGrad)" />

    <!-- 'X' -->
    <polygon points="370,244 391,244 446,336 425,336" fill="url(#heroInkGrad)" />
    <polygon points="425,244 446,244 391,336 370,336" fill="url(#heroInkGrad)" />
  </g>

  <!-- ======================================================================= -->
  <!-- Layer 6: Bottom Section - Hairline & Fluent Subtitle -->
  <!-- ======================================================================= -->
  <g id="bottom-section">
    <!-- Dividing line under INDEX -->
    <line x1="196" y1="378" x2="456" y2="378" stroke="#dfdad9" stroke-width="1.8" stroke-linecap="round" />
    <line x1="196" y1="379" x2="456" y2="379" stroke="#ffffff" stroke-width="0.8" opacity="0.7" />
    <circle cx="456" cy="378" r="4" fill="url(#rubyGrad)" />
    <circle cx="455" cy="377" r="1" fill="#ffffff" opacity="0.8" />
    
    <!-- Engraved LITERATURE HUD in refined typography -->
    <text x="196" y="410" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6e6882" letter-spacing="3.8">LITERATURE HUD</text>
  </g>
</svg>
